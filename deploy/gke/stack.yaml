# The same stack on GKE: images from Artifact Registry with the models baked in,
# CPU-based HPAs on both tiers, and the gateway behind an external load balancer.
# Node autoscaling (1-4 x e2-standard-4) is set on the cluster's node pool, so a
# spike can add both pods and nodes. Apply with:  kubectl apply -f deploy/gke/stack.yaml
apiVersion: v1
kind: Namespace
metadata: {name: sla}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: accurate, namespace: sla, labels: {app: accurate}}
spec:
  replicas: 1
  selector: {matchLabels: {app: accurate}}
  template:
    metadata: {labels: {app: accurate, tier: accurate}}
    spec:
      containers:
        - name: modelserver
          image: us-central1-docker.pkg.dev/project-1adf2361-a5bc-4d4a-a7f/slagw/modelserver:v1
          env:
            - {name: MODEL_DIR, value: /models/resnet50_v2_int8}
            - {name: TIER, value: accurate}
            - {name: VERSION, value: v2}
            - {name: ORT_THREADS, value: "2"}
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: "1", memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 10}
          lifecycle:
            preStop: {exec: {command: ["sleep", "5"]}}   # let in-flight requests finish before the pod goes
---
apiVersion: v1
kind: Service
metadata: {name: accurate, namespace: sla}
spec:
  selector: {app: accurate}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fast, namespace: sla, labels: {app: fast}}
spec:
  replicas: 1
  selector: {matchLabels: {app: fast}}
  template:
    metadata: {labels: {app: fast, tier: fast}}
    spec:
      containers:
        - name: modelserver
          image: us-central1-docker.pkg.dev/project-1adf2361-a5bc-4d4a-a7f/slagw/modelserver:v1
          env:
            - {name: MODEL_DIR, value: /models/mobilenet_v3_large_fp32}
            - {name: TIER, value: fast}
            - {name: VERSION, value: v1}
            - {name: ORT_THREADS, value: "2"}
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: "1", memory: 384Mi}
            limits: {cpu: "2", memory: 768Mi}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 10}
          lifecycle:
            preStop: {exec: {command: ["sleep", "5"]}}
---
apiVersion: v1
kind: Service
metadata: {name: fast, namespace: sla}
spec:
  selector: {app: fast}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: accurate, namespace: sla}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: accurate}
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 0, policies: [{type: Pods, value: 2, periodSeconds: 15}]}
    scaleDown: {stabilizationWindowSeconds: 120, policies: [{type: Pods, value: 1, periodSeconds: 30}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: fast, namespace: sla}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: fast}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 0, policies: [{type: Pods, value: 1, periodSeconds: 15}]}
    scaleDown: {stabilizationWindowSeconds: 120}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: sla, labels: {app: gateway}}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: us-central1-docker.pkg.dev/project-1adf2361-a5bc-4d4a-a7f/slagw/gateway:v1
          env:
            - {name: ACCURATE_URL, value: "http://accurate.sla.svc.cluster.local:8000"}
            - {name: FAST_URL, value: "http://fast.sla.svc.cluster.local:8000"}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: "1", memory: 256Mi}
            limits: {cpu: "2", memory: 512Mi}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: sla}
spec:
  selector: {app: gateway}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: gateway-external, namespace: sla}
spec:
  type: LoadBalancer
  selector: {app: gateway}
  ports: [{port: 80, targetPort: 8080}]
