# Local stack: two model tiers, the gateway, Prometheus, Grafana and Jaeger.
#   make up        start it          http://localhost:8080 (gateway)  :9090 (Prometheus)  :3000 (Grafana)  :16686 (Jaeger)
#   make canary    also start the v2 and faulty model servers used in the canary experiments
# Each model server gets the same CPU budget (2 cores) so the tiers compare fairly.

x-modelserver: &modelserver
  build: {context: ., dockerfile: docker/modelserver.Dockerfile}
  image: slagw-modelserver
  volumes: ["./models/artifacts:/models:ro"]
  cpus: 2
  mem_limit: 1g
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
    interval: 2s
    retries: 30

services:
  accurate:             # ResNet-50 (IMAGENET1K_V2 weights), int8
    <<: *modelserver
    environment: {MODEL_DIR: /models/resnet50_v2_int8, TIER: accurate, VERSION: v2, ORT_THREADS: 2, OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"}

  fast:                 # MobileNetV3-Large, fp32 (int8 was only 1.6 ms faster and 4 points less accurate)
    <<: *modelserver
    environment: {MODEL_DIR: /models/mobilenet_v3_large_fp32, TIER: fast, VERSION: v1, ORT_THREADS: 2, OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"}

  accurate-v1:          # canary experiment: the previous version (ResNet-50 V1 weights, int8) as stable
    <<: *modelserver
    profiles: [canary]
    environment: {MODEL_DIR: /models/resnet50_v1_int8, TIER: accurate, VERSION: v1, ORT_THREADS: 2, OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"}

  accurate-bad:         # canary experiment: v2 with an injected fault, 8% errors and +150 ms
    <<: *modelserver
    profiles: [canary]
    environment: {MODEL_DIR: /models/resnet50_v2_int8, TIER: accurate, VERSION: v2-faulty, ORT_THREADS: 2,
                  FAULT_ERROR_RATE: "0.08", FAULT_LATENCY_MS: "150", OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"}

  gateway:
    build: {context: ., dockerfile: docker/gateway.Dockerfile}
    image: slagw-gateway
    ports: ["8080:8080"]
    cpus: 1.5
    environment:
      ACCURATE_URL: ${ACCURATE_URL:-http://accurate:8000}
      ACCURATE_NAME: ${ACCURATE_NAME:-resnet50-v2-int8}
      SHADOW_FRACTION: ${SHADOW_FRACTION:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Trace 10% of requests (model servers follow the gateway's decision via traceparent),
      # so tracing costs little CPU during the load experiments.
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 2s
      retries: 30
    depends_on:
      accurate: {condition: service_healthy}
      fast: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.0.9
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gateway.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  jaeger:               # traces, received over OTLP; UI at http://localhost:16686
    image: jaegertracing/all-in-one:1.60
    ports: ["16686:16686", "4318:4318"]

  loadgen:              # run with: docker compose run --rm loadgen python loadtest/...
    build: {context: ., dockerfile: docker/loadgen.Dockerfile}
    image: slagw-loadgen
    profiles: [tools]
    cpus: 2
    volumes: [".:/work"]
